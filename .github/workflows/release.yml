name: Build and Publish Debian Package

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# we need write permissions to upload the .deb asset to the release
permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: install build dependencies
        run: |
          sudo apt-get update
          # debhelper and dpkg-dev are all we need to build a clean debian package
          sudo apt-get install -y dpkg-dev debhelper

      - name: build debian package
        run: |
          # this reads our debian/ folder and compiles the .deb
          dpkg-buildpackage -us -uc -b
          mkdir -p output
          mv ../*.deb output/

      - name: upload to github release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: output/*.deb
          generate_release_notes: true