name: Code Quality and Syntax Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
        
    - name: Install basic linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        
    - name: Run human-friendly syntax check
      run: |
        # we just want to catch major errors and keep the code clean
        # no strict styling rules, just pure readability
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
